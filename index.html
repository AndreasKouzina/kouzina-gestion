function fmt(n) {
  var v = parseFloat(n) || 0;
  return v % 1 === 0 ? String(v) : v.toFixed(1);
}

function getMarchesJour(jour) {
  return MARCHES[jour] || [];
}

function getJourSuiv(jour) {
  var idx = JOURS.indexOf(jour);
  return JOURS[(idx + 1) % 7];
}

function todayJour() {
  var d = new Date();
  var day = d.getDay();
  return JOURS[day === 0 ? 6 : day - 1];
}

function safeGet(obj, keys) {
  var cur = obj;
  for (var i = 0; i < keys.length; i++) {
    if (cur == null || cur === undefined) return undefined;
    cur = cur[keys[i]];
  }
  return cur;
}

function safeNum(obj, keys) {
  var v = safeGet(obj, keys);
  return (v == null || v === undefined) ? 0 : (parseFloat(v) || 0);
}

function getDotation(dotations, jour, marche, platId) {
  return safeNum(dotations, [jour, marche, platId]);
}

function getTotalDotJ1(jour, plats, dotations) {
  var jourSuiv = getJourSuiv(jour);
  var marchesSuiv = getMarchesJour(jourSuiv);
  var t = {};
  plats.forEach(function(p) {
    t[p.id] = marchesSuiv.reduce(function(a, m) {
      return a + getDotation(dotations, jourSuiv, m, p.id);
    }, 0);
  });
  return t;
}

function getStockLabo(stocks, platId) {
  return safeNum(stocks, ["labo", platId]);
}

function getStockEmp(stocks, emp, platId) {
  return safeNum(stocks, [emp, platId]);
}

function getStockDispoBout(stocks, dotations, jour, platId) {
  var jourSuiv = getJourSuiv(jour);
  var marchesSuiv = getMarchesJour(jourSuiv);
  var labo = getStockLabo(stocks, platId);
  if (!marchesSuiv.length) return labo;
  var res = marchesSuiv.reduce(function(a, m) {
    return a + getDotation(dotations, jourSuiv, m, platId);
  }, 0);
  return Math.max(0, labo - res);
}

function setStockSafe(prev, emp, platId, val) {
  var prevEmp = (prev && prev[emp]) ? prev[emp] : {};
  var newEmp = Object.assign({}, prevEmp, {[platId]: Math.max(0, val)});
  return Object.assign({}, prev || {}, {[emp]: newEmp});
}

function updateStockSafe(prev, emp, platId, delta) {
  var cur = safeNum(prev, [emp, platId]);
  return setStockSafe(prev, emp, platId, cur + delta);
}

function VuePatron(props) {
  var plats=props.plats, setPlats=props.setPlats, dotations=props.dotations;
  var stocks=props.stocks, cmdBoutiques=props.cmdBoutiques, jourSel=props.jourSel;
  var presence=props.presence, haccp=props.haccp, inventaires=props.inventaires;
  var anticipation=props.anticipation||{}, setAnticipation=props.setAnticipation||function(){};
  var cmdValidation=props.cmdValidation||{};
  var pertesArchive=props.pertesArchive||{};
  var dotBoutiques=props.dotBoutiques||{}, setDotBoutiques=props.setDotBoutiques||function(){};
  var stocksMarches=props.stocksMarches||{};

  var _sc = React.useState(false); var showCat=_sc[0]; var setShowCat=_sc[1];

  var marchesJour = getMarchesJour(jourSel);
  var totDotJ1 = getTotalDotJ1(jourSel, plats, dotations);
  var today = new Date().toISOString().slice(0,10);
  var presJour = (presence && presence[today]) ? presence[today] : {};
  var invFait = !!(inventaires && inventaires[today] && inventaires[today].valide);

  function stockDispo(pid) { return getStockLabo(stocks, pid); }
  function stockDispoBout(pid) { return getStockDispoBout(stocks, dotations, jourSel, pid); }
  function cmdB(pid) {
    return BOUTIQUES.reduce(function(a,b) {
      return a + safeNum(cmdBoutiques, [b, pid]);
    }, 0);
  }
  function antVerte(pid) {
    return BOUTIQUES.reduce(function(a,b){
      var ant=anticipation[b]&&anticipation[b][pid];
      return a+(ant&&ant.etat==="vert"?(ant.qte||0):0);
    },0);
  }
  // Besoin boutique J+1 = dotation J+1 - stock actuel boutique
  var jourSuiv2 = getJourSuiv(jourSel);
  function dotBoutPatron(pid) {
    return BOUTIQUES.reduce(function(a,b){
      var dot = dotBoutiques[b] && dotBoutiques[b][jourSuiv2] ? (dotBoutiques[b][jourSuiv2][pid]||0) : 0;
      return a + dot;
    }, 0);
  }
  function aProduire(p) { return Math.max(0, totDotJ1[p.id] + dotBoutPatron(p.id) - stockDispo(p.id)); }
  function alerte(p) {
    var r = stockDispo(p.id) - totDotJ1[p.id] - cmdB(p.id);
    return r < 0 ? "rouge" : r <= 2 ? "orange" : "vert";
  }

  var totalAP = plats.reduce(function(a,p){return a+aProduire(p);}, 0);
  var totalInv = marchesJour.reduce(function(a,m){
    return a + plats.reduce(function(b,p){return b+getStockEmp(stocks,m,p.id);}, 0);

  // Pertes

  var moisCourant = today2.getFullYear()+"-"+String(today2.getMonth()+1).padStart(2,"0");
  var pertesListe = (function(){
    var par = {};

      if(!par[key]) par[key]={plat:r.plat,boutique:r.boutique,total:0};
      par[key].total+=r.qte||0;

    return Object.values(par).sort(function(a,b){return b.total-a.total;});
  })();

  function exportPertes() {
    var rows = Object.values(pertesArchive).filter(function(r){

    var header = "Date;Boutique;Plat;Quantite";

    var header = "Date;Heure;Boutique;Vendeur;Plat1;Temp1;Plat2;Temp2;Conforme";

      var t1 = (r.temperatures && r.temperatures[1]) ? r.temperatures[1] : {};
      return [r.date,r.heure,r.boutique,r.vendeur,t0.plat||"",t0.temp||"",t1.plat||"",t1.temp||"",r.conforme?"OUI":"NON"].join(";");

  var invFait = !!(invDuJour && invDuJour.valide);
  var invHeure = invDuJour ? invDuJour.heure : null;

  function cmdB(pid) {
    return BOUTIQUES.reduce(function(a,b){return a+safeNum(cmdBoutiques,[b,pid]);},0);
  }
  function getStock(pid) { return getStockLabo(stocks,pid); }
  function setLabo(pid,v) { setStocks(function(prev){return setStockSafe(prev,"labo",pid,v);}); }
  function addLabo(pid,d) { setStocks(function(prev){return updateStockSafe(prev,"labo",pid,d);}); }
  function invTotal(pid) {
    return marchesJour.reduce(function(a,m){return a+getStockEmp(stocks,m,pid);},0);
  }
  // Anticipations vertes des boutiques -> ajoutées à la production
  var anticipation = props.anticipation || {};
  var prodJour = props.prodJour || {};
  var dotBoutiques = props.dotBoutiques || {};
  var stocksBoutiques = props.stocksBoutiques || {};

  // Dotation boutique J+1 pour un plat
  function dotBout(pid) {
    var jourSuiv = getJourSuiv(jourSel);
    return BOUTIQUES.reduce(function(a,b){
      var dot = dotBoutiques[b] && dotBoutiques[b][jourSuiv] ? (dotBoutiques[b][jourSuiv][pid]||0) : 0;
      return a + dot;
    }, 0);
  }

  // Stock actuel en boutique
  function stockActuelBout(pid) {
    return BOUTIQUES.reduce(function(a,b){
      var today = new Date().toISOString().slice(0,10).replace(/-/g,"_");
      var sb = stocksBoutiques[b] && stocksBoutiques[b][today] ? (stocksBoutiques[b][today][pid]||0) : 0;
      return a + sb;
    }, 0);
  }

  // Besoin boutique = dotation J+1 - stock actuel boutique
  function besoinBout(pid) {
    return Math.max(0, dotBout(pid) - stockActuelBout(pid));
  }
  var setProdJour = props.setProdJour || function(){};
  var today = new Date().toISOString().slice(0,10);

  // Production du jour uniquement (pas le stock existant)
  function getProdJour(pid) {
    return (prodJour[today] && prodJour[today][pid]) ? (prodJour[today][pid] || 0) : 0;
  }
  function addProdJour(pid, delta) {
    var cur = getProdJour(pid);
    var newVal = Math.max(0, Math.round((cur + delta) * 2) / 2);
    setProdJour(function(prev){
      var n = Object.assign({}, prev || {});
      n[today] = Object.assign({}, n[today] || {});
      n[today][pid] = newVal;
      return n;
    });
    // Aussi mettre à jour le stock labo
    addLabo(pid, delta);
  }

  function antVerte(pid) {
    return BOUTIQUES.reduce(function(a,b){
      var ant = anticipation[b] && anticipation[b][pid];
      return a + (ant && ant.etat==="vert" ? (ant.qte||0) : 0);
    }, 0);
  }
  function aProduire(p) { return Math.max(0, totDotJ1[p.id] + besoinBout(p.id) - getStock(p.id)); }

  function validerInventaire() {

function VuePreparateur(props) {

function VueBoutique(props) {
  var plats=props.plats, stocks=props.stocks, setStocks=props.setStocks;
  var dotations=props.dotations, cmdBoutiques=props.cmdBoutiques;
  var setCmdBoutiques=props.setCmdBoutiques, jourSel=props.jourSel;
  var nomVendeur=props.nomVendeur, haccp=props.haccp, setHaccp=props.setHaccp;
  var platsList = Array.isArray(plats) ? plats : Object.keys(plats||{}).sort(function(a,b){return parseInt(a)-parseInt(b);}).map(function(k){return plats[k];});

  var _sb=React.useState(BOUTIQUES[0]); var boutique=_sb[0]; var setBoutique=_sb[1];
  var _st=React.useState("dotations"); var tab=_st[0]; var setTab=_st[1];
  var _sjd=React.useState(todayJour()); var jourDot=_sjd[0]; var setJourDot=_sjd[1];
  var _sm=React.useState(false); var showTemp=_sm[0]; var setShowTemp=_sm[1];
  var _sc=React.useState([]); var platsCtrl=_sc[0]; var setPlatsCtrl=_sc[1];

  var marchesJour = getMarchesJour(jourSel);

  function getCmd(pid){return safeNum(cmdBoutiques,[boutique,pid]);}
  function setCmd(pid,v){
    setCmdBoutiques(function(prev){
      var n=Object.assign({},prev||{});
      n[boutique]=Object.assign({},n[boutique]||{});
      n[boutique][pid]=v;
      return n;
    });
  }
  function stockBout(pid){return getStockEmp(stocks,boutique,pid);}
  function setStockB(pid,v){setStocks(function(prev){return setStockSafe(prev,boutique,pid,v);});}
  function dispoBout(pid){return getStockDispoBout(stocks,dotations,jourSel,pid);}
  function reserveM(pid){
    var js=getJourSuiv(jourSel); var ms=getMarchesJour(js);
    return ms.reduce(function(a,m){return a+getDotation(dotations,js,m,pid);},0);
  }

  var totalCmd=platsList.reduce(function(a,p){return a+getCmd(p.id);},0);
  var hasUrgence=platsList.some(function(p){return getCmd(p.id)>dispoBout(p.id);});
  var ruptures=platsList.filter(function(p){return stockBout(p.id)===0;});
  var bas=platsList.filter(function(p){return stockBout(p.id)>0&&stockBout(p.id)<=2;});

  function piocher2(){
    var cmd=safeGet(cmdBoutiques,[boutique])||{};
    var ids=Object.keys(cmd).filter(function(id){return (parseFloat(cmd[id])||0)>0;});
    var shuffled=ids.slice().sort(function(){return Math.random()-.5;}).slice(0,2);
    return shuffled.map(function(id){return platsList.find(function(p){return p.id===id;});}).filter(Boolean);
  }

  // Piocher 2 plats aléatoires depuis les dotations boutique pour contrôle HACCP réception matin
  function piocher2Stocks(){
    var jourSuiv = getJourSuiv(jourSel);
    var dot = (props.dotBoutiques && props.dotBoutiques[boutique] && props.dotBoutiques[boutique][jourSuiv]) || {};
    var ids = Object.keys(dot).filter(function(id){return (dot[id]||0)>0;});
    var shuffled = ids.slice().sort(function(){return Math.random()-.5;}).slice(0,2);
    return shuffled.map(function(id){return platsList.find(function(p){return p.id===id;});}).filter(Boolean);
  }

  var today=new Date().toISOString().slice(0,10);

  return h("div",null,
    showTemp&&platsCtrl.length>0&&h(ModalTemp,{platsCtrl:platsCtrl,boutique:boutique,
      nomVendeur:nomVendeur,
      onValider:function(temps,ok){
        var now=new Date();
        var heure=String(now.getHours()).padStart(2,"0")+"h"+String(now.getMinutes()).padStart(2,"0");
        var key=(today+"_"+boutique+"_"+heure).replace(/[^a-zA-Z0-9_]/g,"_");
        setHaccp(function(prev){
          var entries=Object.entries(prev||{}).slice(-59);

            temperatures:platsCtrl.map(function(p){return {plat:p.nom,temp:parseFloat(temps[p.id]||0)};})};
          return n;
        });
        // Mettre à jour tous les stocks en un seul appel

          var next = Object.assign({}, prev||{});
          platsList.forEach(function(p){
            var q = getCmd(p.id);
            if(q>0){
              // Ajouter au stock boutique
              var curBout = (next[boutique]&&next[boutique][p.id]) ? next[boutique][p.id] : 0;
              next[boutique] = Object.assign({}, next[boutique]||{});
              next[boutique][p.id] = Math.max(0, curBout + q);
              // Retirer du stock labo
              var curLabo = (next["labo"]&&next["labo"][p.id]) ? next["labo"][p.id] : 0;
              next["labo"] = Object.assign({}, next["labo"]||{});

          });
          return next;

        // Enregistrer la réception boutique du matin
