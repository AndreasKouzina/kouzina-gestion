function fmt(n) {
  var v = parseFloat(n) || 0;
  return v % 1 === 0 ? String(v) : v.toFixed(1);
}

function getMarchesJour(jour) {
  return MARCHES[jour] || [];
}

function getJourSuiv(jour) {
  var idx = JOURS.indexOf(jour);
  return JOURS[(idx + 1) % 7];
}

function todayJour() {
  var d = new Date();
  var day = d.getDay();
  return JOURS[day === 0 ? 6 : day - 1];
}

function safeGet(obj, keys) {
  var cur = obj;
  for (var i = 0; i < keys.length; i++) {
    if (cur == null || cur === undefined) return undefined;
    cur = cur[keys[i]];
  }
  return cur;
}

function safeNum(obj, keys) {
  var v = safeGet(obj, keys);
  return (v == null || v === undefined) ? 0 : (parseFloat(v) || 0);
}

function getDotation(dotations, jour, marche, platId) {
  return safeNum(dotations, [jour, marche, platId]);
}

function getTotalDotJ1(jour, plats, dotations) {
  var jourSuiv = getJourSuiv(jour);
  var marchesSuiv = getMarchesJour(jourSuiv);
  var t = {};
  plats.forEach(function(p) {
    t[p.id] = marchesSuiv.reduce(function(a, m) {
      return a + getDotation(dotations, jourSuiv, m, p.id);
    }, 0);
  });
  return t;
}

function getStockLabo(stocks, platId) {
  return safeNum(stocks, ["labo", platId]);
}

function getStockEmp(stocks, emp, platId) {
  return safeNum(stocks, [emp, platId]);
}

function getStockDispoBout(stocks, dotations, jour, platId) {
  var jourSuiv = getJourSuiv(jour);
  var marchesSuiv = getMarchesJour(jourSuiv);
  var labo = getStockLabo(stocks, platId);
  if (!marchesSuiv.length) return labo;
  var res = marchesSuiv.reduce(function(a, m) {
    return a + getDotation(dotations, jourSuiv, m, platId);
  }, 0);
  return Math.max(0, labo - res);
}

function setStockSafe(prev, emp, platId, val) {
  var prevEmp = (prev && prev[emp]) ? prev[emp] : {};
  var newEmp = Object.assign({}, prevEmp, {[platId]: Math.max(0, val)});
  return Object.assign({}, prev || {}, {[emp]: newEmp});
}

function updateStockSafe(prev, emp, platId, delta) {
  var cur = safeNum(prev, [emp, platId]);
  return setStockSafe(prev, emp, platId, cur + delta);
}

  function stockDispoBout(pid) { return getStockDispoBout(stocks, dotations, jourSel, pid); }
  function cmdB(pid) {
    return BOUTIQUES.reduce(function(a,b) {
      return a + safeNum(cmdBoutiques, [jourSel, b, pid]);
    }, 0);
  }
  function antVerte(pid) {
    return BOUTIQUES.reduce(function(a,b){
      var ant=anticipation[b]&&anticipation[b][pid];
      return a+(ant&&ant.etat==="vert"?(ant.qte||0):0);
    },0);
  }
  function aProduire(p) { return Math.max(0, totDotJ1[p.id] + cmdB(p.id) + antVerte(p.id) - stockDispo(p.id)); }
  function alerte(p) {
    var r = stockDispo(p.id) - totDotJ1[p.id] - cmdB(p.id);
    return r < 0 ? "rouge" : r <= 2 ? "orange" : "vert";
  }

  var totalAP = plats.reduce(function(a,p){return a+aProduire(p);}, 0);
  var totalInv = marchesJour.reduce(function(a,m){
    return a + plats.reduce(function(b,p){return b+getStockEmp(stocks,m,p.id);}, 0);
  }, 0);

  // Pertes
  var pertes = props.pertes||{};
  var today2 = new Date();
  var moisCourant = today2.getFullYear()+"-"+String(today2.getMonth()+1).padStart(2,"0");
  var pertesListe = (function(){
    var par = {};
    Object.values(pertes).forEach(function(r){
      if(!r.date||r.date.indexOf(moisCourant)!==0) return;
      var key=(r.plat||"")+"_"+(r.boutique||"");
      if(!par[key]) par[key]={plat:r.plat,boutique:r.boutique,total:0};
      par[key].total+=r.qte||0;
    });
    return Object.values(par).sort(function(a,b){return b.total-a.total;});
  })();

  function exportPertes() {
    var rows = Object.values(pertes).filter(function(r){
      return r.date&&r.date.indexOf(moisCourant)===0;
    }).sort(function(a,b){return a.date>b.date?1:-1;});
    var header = "Date;Boutique;Plat;Quantite";
    var lines = rows.map(function(r){
      return [r.date,r.boutique||"",r.plat||"",r.qte||0].join(";");
    });
    var csv = [header].concat(lines).join("\n");
    var blob = new Blob([csv],{type:"text/csv;charset=utf-8;"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "kouzina-pertes-"+moisCourant+".csv";
    a.click();
  }

  function exportCSV() {
    var rows = Object.values(haccp || {}).sort(function(a,b){return new Date(b.date)-new Date(a.date);}).slice(0,60);
    var header = "Date;Heure;Boutique;Vendeur;Plat1;Temp1;Plat2;Temp2;Conforme";
    var lines = rows.map(function(r) {
      var t0 = (r.temperatures && r.temperatures[0]) ? r.temperatures[0] : {};
      var t1 = (r.temperatures && r.temperatures[1]) ? r.temperatures[1] : {};
      return [r.date,r.heure,r.boutique,r.vendeur,t0.plat||"",t0.temp||"",t1.plat||"",t1.temp||"",r.conforme?"OUI":"NON"].join(";");
    });
    var csv = [header].concat(lines).join("\n");
    var blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "kouzina-haccp-"+today+".csv";
    a.click();
  }

  return h("div", null,
    showCat && h(ModalCatalogue, {plats:plats,setPlats:setPlats,onClose:function(){setShowCat(false);}}),

    // KPIs
    h("div", {style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}},
      [
        ["🍳","À produire",fmt(totalAP),"orange"],
        ["🛒","Marchés",marchesJour.length,"bleu"],
        ["↩","Invendus",fmt(totalInv),totalInv>0?"rouge":"vert"],
        ["📋","Inventaire",invFait?"Fait":"À faire",invFait?"vert":"orange"]
      ].map(function(kpi) {
        return h(Card, {key:kpi[1], style:{padding:12,textAlign:"center"}},
          h("div",{style:{fontSize:18}},kpi[0]),
          h("div",{style:{fontSize:10,color:C.gris,fontWeight:700,margin:"2px 0"}},kpi[1]),
          h("div",{style:{fontSize:22,fontWeight:900,fontFamily:C.serif,
            color:kpi[3]==="vert"?"#155724":kpi[3]==="rouge"?"#991b1b":kpi[3]==="orange"?"#9a3412":"#0c4a6e"}},kpi[2])
        );
      })
    ),

    // Présence
    marchesJour.length > 0 && h(Card, {style:{marginBottom:14,padding:"12px 16px"}},
      h(SecTitle, {title:"Presences ce matin"}),
      Object.keys(presJour).length === 0
        ? h("div",{style:{color:C.gris,fontSize:13}},"Aucune confirmation.")
        : Object.keys(presJour).map(function(nom) {
            return h("div",{key:nom,style:{display:"flex",justifyContent:"space-between",
              padding:"7px 10px",background:"#d4edda",borderRadius:8,marginBottom:3}},
              h("span",{style:{fontWeight:700,color:C.navy}},"Vendeur: "+nom),
              h(Badge,{label:"OK "+presJour[nom],color:"vert"})

          })

    // Anticipations oranges à valider
    (function(){
      var aValider=[];
      BOUTIQUES.forEach(function(b){
        if(!anticipation[b])return;
        Object.keys(anticipation[b]).forEach(function(pid){
          var ant=anticipation[b][pid];
          if(ant&&ant.etat==="orange"){
            var plat=plats.find(function(p){return p.id===pid;});
            if(plat)aValider.push({boutique:b,plat:plat,qte:ant.qte||1});
          }

      return h(Card,{style:{marginBottom:14,padding:"12px 16px",border:"2px solid #fed7aa"}},

            h("div",null,

              h("div",{style:{fontSize:11,color:C.gris}},item.boutique+" · "+fmt(item.qte)+" unité(s)")
            ),
            h("div",{style:{display:"flex",gap:8}},
              h("button",{onClick:function(){
                setAnticipation(function(prev){
                  var n=Object.assign({},prev||{});
                  n[item.boutique]=Object.assign({},n[item.boutique]||{});
                  n[item.boutique][item.plat.id]={etat:"vert",qte:item.qte};
                  return n;

              h("button",{onClick:function(){

    // Table plats
    CATS.map(function(cat) {

      if (!liste.length) return null;
      return h("div", {key:cat},
        h(SecTitle,{title:cat}),
        liste.map(function(p,i) {

          return h("div",{key:p.id,style:{display:"flex",alignItems:"center",justifyContent:"space-between",

            h("div",{style:{flex:1,minWidth:120}},
              h("div",{style:{fontWeight:700,fontSize:14,color:C.navy}},p.nom),
              h("div",{style:{fontSize:11,color:C.gris}},
                "J+1 "+fmt(totDotJ1[p.id])+" · Bouts "+fmt(stockDispoBout(p.id)))
            ),
            h("div",{style:{display:"flex",alignItems:"center",gap:12}},

function VueCuisine(props) {
  var plats=props.plats, dotations=props.dotations, stocks=props.stocks;
  var setStocks=props.setStocks, cmdBoutiques=props.cmdBoutiques;
  var jourSel=props.jourSel, inventaires=props.inventaires, setInventaires=props.setInventaires;

  var _st = React.useState("production"); var tab=_st[0]; var setTab=_st[1];
  var jourSuiv = getJourSuiv(jourSel);

  var marchesJour = getMarchesJour(jourSel);
  var totDotJ1 = getTotalDotJ1(jourSel, plats, dotations);
  var today = new Date().toISOString().slice(0,10);
  var invDuJour = inventaires && inventaires[today] ? inventaires[today] : null;
  var invFait = !!(invDuJour && invDuJour.valide);
  var invHeure = invDuJour ? invDuJour.heure : null;

  function cmdB(pid) {
    return BOUTIQUES.reduce(function(a,b){return a+safeNum(cmdBoutiques,[jourSel,b,pid]);},0);
  }
  function getStock(pid) { return getStockLabo(stocks,pid); }
  function setLabo(pid,v) { setStocks(function(prev){return setStockSafe(prev,"labo",pid,v);}); }
  function addLabo(pid,d) { setStocks(function(prev){return updateStockSafe(prev,"labo",pid,d);}); }
  function invTotal(pid) {
    return marchesJour.reduce(function(a,m){return a+getStockEmp(stocks,m,pid);},0);
  }
  function aProduire(p) { return Math.max(0,totDotJ1[p.id]+cmdB(p.id)-getStock(p.id)); }

  function validerInventaire() {
    var now = new Date();
    var heure = String(now.getHours()).padStart(2,"0")+"h"+String(now.getMinutes()).padStart(2,"0");
    var stocks_snap = {};
    plats.forEach(function(p){stocks_snap[p.id]=getStock(p.id);});
    setInventaires(function(prev){
      var n = Object.assign({},prev||{});
      n[today] = {valide:true,heure:heure,stocks:stocks_snap};
      return n;
    });
  }

  return h("div",null,
    // Header
    h("div",{style:{background:"linear-gradient(135deg,"+C.navy+","+C.navyMid+")",borderRadius:14,

            h("div",{style:{fontSize:20,marginBottom:6}},"ok"),
            h("div",{style:{fontWeight:700,fontSize:15,color:"#155724"}},"Inventaire validé"),

                    display:"inline-block",padding:"1px 7px",borderRadius:6}},

                h("div",{style:{display:"flex",alignItems:"center",gap:12}},

                  h("div",{style:{textAlign:"center"}},
                    h("div",{style:{fontSize:9,color:C.gris,marginBottom:2}},"A PRODUIRE"),
                    h("div",{style:{fontSize:30,fontWeight:900,fontFamily:C.serif,
                      color:ap>0?C.gold:C.vert,minWidth:44,textAlign:"center"}},fmt(ap))
                  )
                )
              )
            );
          })
        );
      })
    )
  );
}

      "*{box-sizing:border-box;}" +
      "input,button,select,textarea{font-family:'DM Sans',Arial,sans-serif;}" +
      "::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-thumb{background:#c8a96e;border-radius:3px;}" +
      "input[type=number]::-webkit-inner-spin-button{opacity:1;}"
    ),

    // Alerte bannière
    alerte && h("div",{style:{position:"fixed",top:0,left:0,right:0,zIndex:9999,
      background:C.navy,color:C.goldLt,padding:"14px 20px",display:"flex",
      alignItems:"center",justifyContent:"space-between",
      boxShadow:"0 4px 20px rgba(0,0,0,.4)",animation:"slideDown .3s ease"}},
      h("div",null,
        h("div",{style:{fontSize:15,fontWeight:800,fontFamily:C.serif}},"Rappel"),
        h("div",{style:{fontSize:13,marginTop:2}},alerte.msg)
      ),
      h("button",{onClick:function(){setAlerte(null);},style:{background:"rgba(255,255,255,.15)",
        border:"none",color:C.goldLt,borderRadius:8,padding:"6px 14px",fontSize:13,
        fontWeight:700,cursor:"pointer"}},"OK")
    ),

    // Header
    h("div",{style:{background:"linear-gradient(135deg,"+C.navy+" 0%,"+C.navyMid+" 60%,"+C.navy+" 100%)",
      padding:"14px 16px 0",boxShadow:"0 4px 20px rgba(0,0,0,.2)"}},
      h("div",{style:{maxWidth:820,margin:"0 auto"}},
        h("div",{style:{display:"flex",alignItems:"baseline",gap:10,marginBottom:14}},
          h("span",{style:{fontSize:22,fontFamily:C.serif,fontWeight:900,color:C.goldLt}},"KOUZINA"),
          h("span",{style:{fontSize:11,color:"#8a9fc4",letterSpacing:2,fontWeight:600}},"TRAITEUR GREC")
        ),
        h("div",{style:{display:"flex",gap:0,overflowX:"auto"}},
          VUES.map(function(v){
            var active=vue===v.id;
            return h("button",{key:v.id,onClick:function(){setVue(v.id);},style:{
              padding:"9px 13px",border:"none",cursor:"pointer",
              background:active?"rgba(240,224,192,.15)":"transparent",
              color:active?C.goldLt:"rgba(240,224,192,.45)",
              fontWeight:active?800:600,fontSize:12,fontFamily:C.sans,
              borderBottom:active?"3px solid "+C.gold:"3px solid transparent",
              whiteSpace:"nowrap",transition:"all .15s"}},v.label);
          })
        )
      )
    ),

    // Sélecteur jour
    h("div",{style:{background:C.blanc,borderBottom:"1px solid "+C.gold,padding:"9px 16px"}},
      h("div",{style:{maxWidth:820,margin:"0 auto",display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}},
        h("span",{style:{fontSize:10,color:C.gris,fontWeight:700,letterSpacing:.5}},"JOUR :"),
        JOURS.map(function(j,i){
          var aM=getMarchesJour(j).length>0; var sel=j===jourSel; var est=j===todayJour();
          return h("button",{key:j,onClick:function(){setJourSel(j);},style:{
            padding:"4px 11px",borderRadius:20,
            border:sel?"none":"1px solid #ddd8d0",
            background:sel?C.navy:aM?"#f0ebe0":C.blanc,
            color:sel?C.goldLt:aM?"#6b5c3e":C.gris,
            fontWeight:sel?700:500,fontSize:11,cursor:"pointer"}},
            JOURS_COURT[i]+(est?" •":""));
        })
      )
    ),

    // Notif banner
    !perm && h("div",{style:{background:"#dde8f5",padding:"8px 16px",
      display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}},
      h("span",{style:{fontSize:12,color:C.navy,fontWeight:600}},"Activez les notifications pour les rappels"),
      h(BtnPrimary,{onClick:function(){
        try{window.Notification.requestPermission().then(function(r){setPerm(r==="granted");});}catch(e){}
      },style:{padding:"5px 12px",fontSize:11}},"Activer")
    ),

    // Contenu
    h("div",{style:{maxWidth:820,margin:"0 auto",padding:"22px 14px 60px"}},
      vue==="patron"      && h(VuePatron,{plats:plats,setPlats:setPlats,dotations:dotations,stocks:stocks,cmdBoutiques:cmdBoutiques,jourSel:jourSel,presence:presence,haccp:haccp,inventaires:inventaires,anticipation:anticipation,setAnticipation:setAnticipation,pertes:pertes}),
      vue==="cuisine"     && h(VueCuisine,{plats:plats,dotations:dotations,stocks:stocks,setStocks:setStocks,cmdBoutiques:cmdBoutiques,jourSel:jourSel,inventaires:inventaires,setInventaires:setInventaires}),
      vue==="marche"      && h(VueMarche,{plats:plats,dotations:dotations,setDotations:setDotations,stocks:stocks,setStocks:setStocks,jourSel:jourSel,nomVendeur:nomVendeur,presence:presence,setPresence:setPresence}),
      vue==="preparateur" && h(VuePreparateur,{plats:plats,dotations:dotations,cmdBoutiques:cmdBoutiques,stocks:stocks,jourSel:jourSel}),
      vue==="boutique"    && h(VueBoutique,{plats:plats,stocks:stocks,setStocks:setStocks,dotations:dotations,cmdBoutiques:cmdBoutiques,setCmdBoutiques:setCmdBoutiques,jourSel:jourSel,nomVendeur:nomVendeur,haccp:haccp,setHaccp:setHaccp,anticipation:anticipation,setAnticipation:setAnticipation,pertes:pertes,setPertes:setPertes}),
      vue==="fiches"      && h(VueFiches,{plats:plats,fiches:fiches,setFiches:setFiches,miseEnPlace:miseEnPlace,setMiseEnPlace:setMiseEnPlace})
    )
  );
}


    try {
      var root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(App));
    } catch(e) {
      document.getElementById('root').innerHTML =
        '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:#f5f1ea;padding:24px;text-align:center;">' +
        '<div style="font-size:24px;color:#1a2744;font-weight:800;margin-bottom:8px;">Erreur</div>' +
        '<div style="font-size:13px;color:#6b7280;margin-bottom:20px;">' + e.message + '</div>' +
        '<button onclick="location.reload()" style="background:#1a2744;color:#f0e0c0;border:none;border-radius:10px;padding:12px 24px;font-size:14px;cursor:pointer;">Reessayer</button>' +
        '</div>';
    }
  </script>
</body>
</html>
